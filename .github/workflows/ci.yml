name: CI

# A bare `push:` fires on every branch, and the pull_request event fires on the
# same commit — every check ran twice for no extra signal. Branch work is covered
# by its PR; main is covered on merge.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's run still in progress. A push to main
# gets a group of its own (its sha), so a run on main is never cancelled or
# left pending behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The test files each job runs, and their order, are in tests/SUITE;
# `node tests/run.mjs <group>` runs one group and fails on a group with no files.
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check
        run: |
          set -euo pipefail
          node --check server.js
          find lib tests public bin packs tools blocks \( -name '*.js' -o -name '*.mjs' \) -exec node --check {} +
      # Once per run: a job summary shows on the run's page whichever job
      # failed, and always() writes it when this job fails too.
      - name: live containment is a local gate
        if: always()
        run: |
          {
            echo '> [!WARNING]'
            echo '> Live containment checks are a **local** gate (./verify.sh) and were not run here.'
            echo '> A green CI tick is not a containment pass.'
          } >> "$GITHUB_STEP_SUMMARY"

  offline-node:
    # The declared minimum (package.json engines: >=20), pinned exactly, and
    # the current LTS: a feature newer than 20.0 fails here, not on a
    # stranger's machine.
    name: offline (${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['20.0.0', 'lts/*']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: shells the launcher must work under
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dash zsh
      - name: offline suite
        env:
          ACS_SUITE: offline
        run: |
          set -euo pipefail
          node --version
          node tests/run.mjs offline

  # main's branch protection requires a check named exactly `offline`; the
  # matrix reports `offline (<node>)`. This passes only when every Node did.
  offline:
    needs: offline-node
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every Node version passed
        run: test "${{ needs.offline-node.result }}" = success

  stranger-macos:
    # The README is written for a Mac: follow it there too. Current LTS only —
    # the minimum Node is covered by offline (20.0.0).
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: the launcher and the README, followed literally
        env:
          ACS_SUITE: offline
        run: |
          set -euo pipefail
          node --version
          node tests/run.mjs stranger-macos

  package:
    # The npm package as a stranger gets it (tests/package.mjs): `npm pack`,
    # installed into a temp prefix, through npx and into another repo, with a
    # temp HOME and no network; read-only, and checked byte for byte after.
    # The declared minimum Node and LTS on Ubuntu, LTS on macOS.
    name: package (${{ matrix.os }}, ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '20.0.0' }
          - { os: ubuntu-latest, node: 'lts/*' }
          - { os: macos-latest, node: 'lts/*' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: what the tarball holds
        run: npm pack --dry-run
      - name: the packed tarball, installed and run
        run: |
          set -euo pipefail
          node --version
          npm --version
          tgz=$(npm pack | tail -n 1)
          node tests/package.mjs "$PWD/$tgz"

  bunx:
    # What this proves: bunx distribution with Node present. bunx fetches the
    # tarball and runs bin/acs, which starts the studio with node — not that
    # the studio runs on Bun's runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - name: bunx runs the packed tarball
        env:
          ACS_REQUIRE_BUN: '1'
        run: |
          set -euo pipefail
          bun --version
          tgz=$(npm pack | tail -n 1)
          node tests/bunx.mjs "$PWD/$tgz"

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: static security guards and the test list
        run: node tests/run.mjs guards
