name: CI

# A bare `push:` fires on every branch, and the pull_request event fires on the
# same commit — every check ran twice for no extra signal. Branch work is covered
# by its PR; main is covered on merge.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's run still in progress. A push to main
# gets a group of its own (its sha), so a run on main is never cancelled or
# left pending behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The test files each job runs, and their order, are in tests/SUITE;
# `node tests/run.mjs <group>` runs one group and fails on a group with no files.
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check
        run: |
          set -euo pipefail
          node --check server.js
          # node --check reads only its first file (the rest become script
          # arguments), so each file gets its own run; xargs exits non-zero if
          # any run does. An empty match would pass vacuously, so it fails.
          src=(lib tests public bin packs tools)
          n=$(find "${src[@]}" \( -name '*.js' -o -name '*.mjs' \) | wc -l)
          if [ "$n" -eq 0 ]; then echo "no .js or .mjs file under ${src[*]}" >&2; exit 1; fi
          find "${src[@]}" \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check
          echo "node --check: server.js and $n files"
      # Once per run: a job summary shows on the run's page whichever job
      # failed, and always() writes it when this job fails too.
      - name: live containment is a local gate
        if: always()
        run: |
          {
            echo '> [!WARNING]'
            echo '> Live containment checks are a **local** gate (./verify.sh) and were not run here.'
            echo '> A green CI tick is not a containment pass.'
          } >> "$GITHUB_STEP_SUMMARY"

  offline:
    # The declared minimum Node (package.json engines: >=20), pinned exactly:
    # a feature newer than 20.0 fails here, not on a stranger's machine.
    # Current Node is covered on the Mac (stranger-macos). Branch protection
    # requires a check named exactly `offline`.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'
      - name: shells the launcher must work under
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dash zsh
      - name: offline suite
        env:
          ACS_SUITE: offline
        # --jobs 4: one file per core of the Linux runner. The files mostly
        # wait on servers and children, but some assert wall-clock deadlines,
        # so more files than cores risks a false red on the required check.
        # Files marked serial in tests/SUITE run alone first, while the
        # runner is quiet.
        run: |
          set -euo pipefail
          node --version
          nproc
          node tests/run.mjs offline --jobs 4

  stranger-macos:
    # The README is written for a Mac: follow it there, on current Node, and
    # install the npm package there (tests/package.mjs packs this tree itself
    # when given no tarball). The minimum Node is covered on Linux.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: the launcher, the README followed literally, and the package
        env:
          ACS_SUITE: offline
        run: |
          set -euo pipefail
          node --version
          node tests/run.mjs stranger-macos

  package:
    # The npm package as a stranger gets it (tests/package.mjs): `npm pack`,
    # installed into a temp prefix, through npx and into another repo, with a
    # temp HOME and no network; read-only, and checked byte for byte after.
    # Then bunx with the same tarball (tests/bunx.mjs): bunx fetches it and
    # runs bin/acs, which starts the studio with node — bunx distribution with
    # Node present, not the studio on Bun's runtime. On the minimum Node; the
    # Mac job installs the package on current Node.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - name: what the tarball holds
        run: npm pack --dry-run
      - name: the packed tarball, installed and run
        run: |
          set -euo pipefail
          node --version
          npm --version
          tgz=$(npm pack | tail -n 1)
          echo "tgz=$PWD/$tgz" >> "$GITHUB_ENV"
          node tests/package.mjs "$PWD/$tgz"
      # Runs when the tarball was packed, even if the package test failed, so
      # one red step does not hide whether bunx works.
      - name: bunx runs the packed tarball
        if: ${{ !cancelled() && env.tgz != '' }}
        env:
          ACS_REQUIRE_BUN: '1'
        run: |
          set -euo pipefail
          bun --version
          node tests/bunx.mjs "$tgz"

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: static security guards and the test list
        run: node tests/run.mjs guards
