# Publish to npm when a version tag is pushed (v1.2.3), through npm trusted
# publishing: GitHub's OIDC identity stands in for a token, so no npm secret
# exists anywhere. The release is STAGED: it reaches npm only after the
# maintainer approves it on npmjs.com with 2FA.
#
# npmjs.com → agent-config-studio → Settings → Trusted publishing must name
# this repository and the workflow file `publish.yml`, case and extension
# exactly; npm checks the match only at publish time.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later and `npm stage` 11.15.0;
      # pinned so a new npm release cannot change how a release is made.
      - name: npm new enough for trusted publishing
        run: npm install -g npm@12.2.0 && npm --version
      - name: The tag names package.json's version, and the commit is on main
        run: |
          version=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
      # The tarball that is tested is the one that is staged.
      - name: The packed tarball installs and runs
        run: |
          set -euo pipefail
          tgz=$(npm pack | tail -n 1)
          node tests/package.mjs "$PWD/$tgz"
          echo "TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      # A prerelease (1.2.0-beta.1) goes to the `next` dist-tag; npm refuses to
      # stage one without an explicit tag, and it must never become `latest`.
      - name: Stage the release for approval
        run: |
          version=$(node -p "require('./package.json').version")
          case $version in
            *-*) npm stage publish "$TGZ" --tag next ;;
            *) npm stage publish "$TGZ" ;;
          esac
