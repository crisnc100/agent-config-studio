# Template for `wtinit`. Editing this changes the convention for every project
# initialized AFTER the edit — it seeds a project's .worktrees.conf, it does not
# govern one. To change a project already set up, edit its own .worktrees.conf.
#
# Substitutions available:
#   {key}     project name — `wtinit --key <name>` when the checkout is named
#             something else (myapp-main is the repo, myapp is the project)
#   {parent}  the project's own folder, i.e. wherever the repo already lives.
#             Worktrees stay beside the repo; nothing is created outside it.

# Command prefix for this project, set by `wtinit --cmd <p>`. CMD=k gives you
# knew / kls / kgo / krm / kclean / kdev / kenv / ktrunk, usable from any
# directory. It is recorded in repos/<key>.conf, not here — this line documents
# it. A name already taken by another command is skipped, never overwritten.
#CMD=

# The sacred checkout. Always parked on BASE, never used for feature work.
TRUNK={parent}/{key}-trunk

# Where worktrees are created. {parent} = the project's own folder, so they sit
# flat beside the trunk: myapp/myapp-trunk, myapp/myapp-alpha, myapp/myapp-beta.
# Use {parent}/{key}-wt instead when the folder is shared with other projects
# (a folder holding several projects keeps each one's worktrees tidier in a subfolder).
ROOT={parent}

# Directory-name prefix inside ROOT, so `wls` output is self-identifying.
PREFIX={key}-

# What new branches are cut from. wtinit overrides this to origin/staging when
# the repo ships from staging.
BASE=origin/main

# Gitignored local config, copied from TRUNK into each new worktree so it runs.
ENV_FILES=".env .env.local .env.development .env.development.local .envrc"

# Ports wnew hands out, one per worktree, so parallel dev servers never collide.
# Leave empty for projects with no dev server. Whatever set you use here must
# also be registered wherever OAuth redirect URIs are configured.
PORTS=""

# Run once inside a newly created worktree, e.g. "npm install".
POST_CREATE=""
